name: Linux tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - name: Install Qt test runtime
        run: python -m pip install PyQt6==6.10.2
      - name: Test backend without AI or account access
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Test Linux UI with synthetic backends
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s linux/tests -v
